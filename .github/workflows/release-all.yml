# Releases EVERY project, stage by stage: all projects through dev, then (release tags) all through uat, then prd.
# Each box is one project's stage (_stage.yml: plan ─► tool ─► onboard ─► agents). In every stage the projects that
# own tools run first and the others after them (needs: guaranteed order), so a tool is published in an environment
# before any project there connects to it.
#
#   dev-owners ─► dev ─► uat-owners ─► uat ─► prd-owners ─► prd        (each: one box per project)
#
#   release tag v*                     dev, then uat and prd (each after approval) for projects that list them;
#                                      a stage starts only when every project's previous stage succeeded
#   merge to main changing shared code onboarding/, tool-deploy/ or templates/: dev
#   pull request changing shared code  plans and validation in dev (nothing changes)
#   manual run                         dev
# A single project's own changes are released by its trigger workflow, project-<project>.yml.
name: release-all

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["onboarding/**", "tool-deploy/**", "templates/**"]
  pull_request:
    paths: ["onboarding/**", "tool-deploy/**", "templates/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      owners: ${{ steps.list.outputs.owners }}
      others: ${{ steps.list.outputs.others }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os
          projects = sorted(os.path.basename(os.path.dirname(f)) for f in glob.glob("projects/*/project.yaml"))
          owners = sorted({f.split("/")[1] for f in glob.glob("projects/*/tools/*/tool.yaml")} & set(projects))
          print("owners=" + json.dumps(owners))
          print("others=" + json.dumps([p for p in projects if p not in owners]))
          PY

  dev-owners:
    needs: [projects]
    if: ${{ !cancelled() && needs.projects.outputs.owners != '[]' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.owners) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: dev
      all: true
      plan_only: ${{ github.event_name == 'pull_request' }}

  dev:
    needs: [projects, dev-owners]
    if: ${{ !cancelled() && needs.projects.outputs.others != '[]' && needs.dev-owners.result != 'failure' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.others) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: dev
      all: true
      plan_only: ${{ github.event_name == 'pull_request' }}

  # uat: release tags only, after every project's dev succeeded; approval on model-uat / agent-uat.
  uat-owners:
    needs: [projects, dev-owners, dev]
    if: ${{ !cancelled() && needs.projects.outputs.owners != '[]' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.dev-owners.result != 'failure' && needs.dev.result != 'failure' && needs.dev-owners.result != 'cancelled' && needs.dev.result != 'cancelled' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.owners) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: uat
      all: true

  uat:
    needs: [projects, uat-owners, dev-owners, dev]
    if: ${{ !cancelled() && needs.projects.outputs.others != '[]' && needs.uat-owners.result != 'failure' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.dev-owners.result != 'failure' && needs.dev.result != 'failure' && needs.dev-owners.result != 'cancelled' && needs.dev.result != 'cancelled' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.others) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: uat
      all: true

  # prd: release tags only, after every project's uat succeeded; approval on model-prd / agent-prd.
  prd-owners:
    needs: [projects, uat-owners, uat]
    if: ${{ !cancelled() && needs.projects.outputs.owners != '[]' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.uat-owners.result != 'failure' && needs.uat.result != 'failure' && needs.uat-owners.result != 'cancelled' && needs.uat.result != 'cancelled' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.owners) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: prd
      all: true

  prd:
    needs: [projects, prd-owners, uat-owners, uat]
    if: ${{ !cancelled() && needs.projects.outputs.others != '[]' && needs.prd-owners.result != 'failure' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.uat-owners.result != 'failure' && needs.uat.result != 'failure' && needs.uat-owners.result != 'cancelled' && needs.uat.result != 'cancelled' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.others) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: prd
      all: true
