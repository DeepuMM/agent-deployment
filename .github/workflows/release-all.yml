# Releases EVERY project, stage by stage: all projects through dev, then (release tags) all through uat, then prd.
# Each box is one project's stage (_stage.yml: plan ─► tool ─► onboard ─► agents); projects that own tools go first,
# so their tools are published before other projects connect to them.
#
#   dev (per project) ─► uat (per project) ─► prd (per project)
#
#   release tag v*                     dev, then uat and prd (each after approval) for projects that list them;
#                                      a stage starts only when every project's previous stage succeeded
#   merge to main changing shared code onboarding/, tool-deploy/ or templates/: dev
#   pull request changing shared code  plans and validation in dev (nothing changes)
#   manual run                         dev
# A single project's own changes are released by its trigger workflow, project-<project>.yml.
name: release-all

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["onboarding/**", "tool-deploy/**", "templates/**"]
  pull_request:
    paths: ["onboarding/**", "tool-deploy/**", "templates/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os
          projects = sorted(os.path.basename(os.path.dirname(f)) for f in glob.glob("projects/*/project.yaml"))
          owners = {f.split("/")[1] for f in glob.glob("projects/*/tools/*/tool.yaml")}
          print("list=" + json.dumps(sorted(projects, key=lambda p: (p not in owners, p))))
          PY

  dev:
    needs: projects
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.list) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: dev
      all: true
      plan_only: ${{ github.event_name == 'pull_request' }}

  uat:
    needs: [projects, dev]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.list) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: uat
      all: true

  prd:
    needs: [projects, uat]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.list) }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ matrix.project }}
      environment: prd
      all: true
