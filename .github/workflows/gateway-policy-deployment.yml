# Gateway policy deployment: the shared AI gateway policy fragments in gateway/policy-fragments/ (one APIM policy
# fragment per file) and the named value gateway-tenant-id they read. Every agent operation and project API policy
# (agent-deploy) and every project model API policy (model-project-connection) includes them, so a change here reaches
# all of them at once, with no agent redeployed and no project re-run.
# One run per platform environment (platform/environments/<env>.yaml), in the environment's model GitHub environment
# (test: model-test), filtered by MODEL_ENVIRONMENTS when set.
# Pull requests: checks + plan. Main: plan, apply (approval on the environment), then smoke tests of every project
# model API and agent on that gateway.
# Terraform stack: gateway/terraform/gateway-policies (state ai-gateway-policies-<env>.tfstate).
name: gateway-policy-deployment

on:
  pull_request:
    paths: ["gateway/policy-fragments/**", "gateway/terraform/gateway-policies/**", "platform/environments/**"]
  push:
    branches: [main]
    paths: ["gateway/policy-fragments/**", "gateway/terraform/gateway-policies/**", "platform/environments/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.14.9"
  STACK: gateway/terraform/gateway-policies

jobs:
  check:
    name: Format, validate and plan tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=$STACK fmt -check -recursive
      - run: terraform -chdir=$STACK init -backend=false -input=false
      - run: terraform -chdir=$STACK validate
      - run: terraform -chdir=$STACK test
      - id: matrix
        name: Environments to run (every gateway gets the fragments)
        env:
          MODEL_ENVIRONMENTS: ${{ vars.MODEL_ENVIRONMENTS }}
        run: echo "matrix=$(python3 scripts/matrix.py environments)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Plan, apply and smoke test (${{ matrix.environment }})
    needs: check
    if: needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    environment: ${{ matrix.github_environment }}   # required reviewers approve the apply
    concurrency:
      group: gateway-policy-deployment-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - name: Init (state in the environment's Terraform storage)
        run: |
          read RG SA CONT < <(python3 -c "import yaml;s=yaml.safe_load(open('platform/environments/$ENVIRONMENT.yaml'))['terraform_state'];print(s['resource_group'],s['storage_account'],s['container'])")
          terraform -chdir=$STACK init -input=false \
            -backend-config="resource_group_name=$RG" -backend-config="storage_account_name=$SA" \
            -backend-config="container_name=$CONT" -backend-config="key=ai-gateway-policies-$ENVIRONMENT.tfstate" \
            -backend-config="use_oidc=true" -backend-config="use_azuread_auth=true"
      - name: Plan
        run: |
          terraform -chdir=$STACK plan -input=false -var="environment=$ENVIRONMENT" -out=tfplan -no-color | tee plan.txt
          { echo "### Gateway policy plan ($ENVIRONMENT)"; echo '```'; grep -E '^(Plan:|No changes|  # )' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform -chdir=$STACK apply -input=false tfplan
      - name: Smoke test every project model API and agent on this gateway
        # They all include the fragments: prove each still works through the gateway.
        if: github.event_name != 'pull_request'
        run: |
          pip install -q -r scripts/requirements.txt
          read SUB RG APIM < <(python3 -c "import yaml;g=yaml.safe_load(open('platform/environments/$ENVIRONMENT.yaml'))['gateway'];print(g['subscription_id'],g['resource_group'],g['apim_name'])")
          export AZURE_SUBSCRIPTION_ID=$SUB APIM_RESOURCE_GROUP=$RG APIM_NAME=$APIM
          projects=$(python3 -c "import glob,yaml;print(' '.join(f.split('/')[1] for f in sorted(glob.glob('projects/*/project.yaml')) if (yaml.safe_load(open(f)) or {}).get('environment','test')=='$ENVIRONMENT'))")
          token=$(az account get-access-token --query accessToken -o tsv)
          api_exists() { curl -sf -o /dev/null -H "Authorization: Bearer $token" \
            "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM/apis/$1?api-version=2022-08-01"; }
          for p in $projects; do
            if grep -q '^models:' "projects/$p/project.yaml" && api_exists "models-$p"; then
              python gateway/scripts/model_smoke.py access "$p" "$ENVIRONMENT"   # its agents reach each model; others get 401
            fi
            if api_exists "project-$p"; then
              python scripts/agent_pipeline.py smoke "$p"
            else
              echo "$p: agent API not registered on $APIM yet, skipped"
            fi
          done
