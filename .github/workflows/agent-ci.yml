# Pull request checks: validate every agent definition. No Azure access.
name: agent-ci

on:
  pull_request:
    paths: ["projects/**", "scripts/**", "templates/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Validate project and agent definitions
        run: python scripts/agent_pipeline.py validate
      - name: Hosted (code) agents compile
        # Syntax errors fail here, not after a Foundry build. Dependencies are installed by Foundry (remote_build).
        run: |
          for d in $(grep -l '^kind: hosted' projects/*/agents/*/agent.yaml | xargs -r -n1 dirname); do
            src="$d/$(python -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['code']['source_dir'])" $d/agent.yaml)"
            echo "compile $src"; python -m compileall -q "$src"
          done
