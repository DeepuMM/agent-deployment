# Unit: release the agents of ONE project in ONE environment (called by the agent-deploy pipeline).
# Validate, then (not plan_only) new Foundry versions for changed agents, the evaluation gate, the project API on the
# gateway pinned to the evaluated versions, the Developer Portal, and the smoke tests through the gateway.
# plan_only: validation only, no Azure access.
name: _agents

on:
  workflow_call:
    inputs:
      project: {type: string, required: true}
      environment: {type: string, required: true}
      plan_only: {type: boolean, default: false}

permissions:
  id-token: write
  contents: read

jobs:
  agents:
    name: ${{ inputs.plan_only && 'validate' || 'release' }} agents ${{ inputs.project }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: agent-${{ inputs.environment }}
    concurrency:
      group: agents-${{ inputs.project }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      PORTAL_ANONYMOUS: ${{ vars.PORTAL_ANONYMOUS }}   # "true": products visible without portal sign-in
      ACR_NAME: ${{ vars.ACR_NAME }}                   # container registry for hosted agents' images
      PLATFORM_ENVIRONMENT: ${{ inputs.environment }}  # hosted agents: env/<environment>.env and the platform's variables
      PLATFORM_ENVIRONMENTS: ${{ vars.PLATFORM_ENVIRONMENTS }}  # the stages the platform offers
      # The environment's coordinates: variables of the GitHub environment (nothing about environments is in Git).
      APIM_SUBSCRIPTION_ID: ${{ vars.APIM_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_NAME: ${{ vars.APIM_NAME }}
      MODELS_PRODUCT: ${{ vars.MODELS_PRODUCT }}
      FOUNDRY_SUBSCRIPTION_ID: ${{ vars.FOUNDRY_SUBSCRIPTION_ID }}
      FOUNDRY_RESOURCE_GROUP: ${{ vars.FOUNDRY_RESOURCE_GROUP }}
      FOUNDRY_ACCOUNT: ${{ vars.FOUNDRY_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          azure-client-id: ${{ !inputs.plan_only && vars.AZURE_CLIENT_ID || '' }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate
        run: python scripts/agent_pipeline.py validate ${{ inputs.project }}
      - name: Deploy agents to Foundry
        if: ${{ !inputs.plan_only }}
        run: python scripts/agent_pipeline.py deploy ${{ inputs.project }}
      - name: Foundry evaluation gate (new agent versions)
        if: ${{ !inputs.plan_only }}
        run: python scripts/agent_pipeline.py evaluate ${{ inputs.project }}
      - name: Register the project API on the gateway and publish developer docs
        if: ${{ !inputs.plan_only }}
        run: python scripts/agent_pipeline.py register ${{ inputs.project }}
      - name: Smoke test every agent through the gateway
        if: ${{ !inputs.plan_only }}
        run: python scripts/agent_pipeline.py smoke ${{ inputs.project }}
