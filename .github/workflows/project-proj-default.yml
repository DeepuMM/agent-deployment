name: project proj-default

on:
  push:
    branches: [main]
    paths: ["projects/proj-default/**"]
  pull_request:
    paths: ["projects/proj-default/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-proj-default-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    uses: ./.github/workflows/_detect.yml
    with:
      project: proj-default

  dev:
    needs: detect
    uses: ./.github/workflows/_stage.yml
    with:
      project: proj-default
      environment: dev
      tools: ${{ needs.detect.outputs.tools }}
      onboard: ${{ needs.detect.outputs.project }}
      agents: ${{ needs.detect.outputs.agents }}
      plan_only: ${{ github.event_name == 'pull_request' }}
