# Promotion of ONE project through every environment it lists, used by release-all.yml (release tags, shared-code
# changes, manual runs). Each stage is one _stage.yml call (tools ─► onboarding ─► agents in that environment):
#
#   detect ─► dev ─► uat ─► prd          uat and prd: release tags v* only, each after the previous stage succeeded,
#                                         with approval (required reviewers on model-/agent-uat and -prd)
#
# A project's own merges run only its first stage, from its trigger workflow (project-<project>.yml).
name: _release

on:
  workflow_call:
    inputs:
      project: {type: string, required: true}
      plan_only: {type: boolean, default: false}
      all: {type: boolean, default: false}

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    uses: ./.github/workflows/_detect.yml
    with:
      project: ${{ inputs.project }}
      all: ${{ inputs.all }}

  dev:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.environments), 'dev')
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ inputs.project }}
      environment: dev
      tools: ${{ needs.detect.outputs.tools }}
      onboard: ${{ needs.detect.outputs.project }}
      agents: ${{ needs.detect.outputs.agents }}
      plan_only: ${{ inputs.plan_only }}

  uat:
    needs: [detect, dev]
    if: ${{ !cancelled() && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'uat') && needs.dev.result != 'failure' }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ inputs.project }}
      environment: uat
      tools: ${{ needs.detect.outputs.tools }}
      onboard: ${{ needs.detect.outputs.project }}
      agents: ${{ needs.detect.outputs.agents }}

  prd:
    needs: [detect, dev, uat]
    if: ${{ !cancelled() && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'prd') && needs.dev.result != 'failure' && needs.uat.result != 'failure' }}
    uses: ./.github/workflows/_stage.yml
    with:
      project: ${{ inputs.project }}
      environment: prd
      tools: ${{ needs.detect.outputs.tools }}
      onboard: ${{ needs.detect.outputs.project }}
      agents: ${{ needs.detect.outputs.agents }}
