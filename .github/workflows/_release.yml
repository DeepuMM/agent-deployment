# Release of ONE project, stage by stage through the environments its project.yaml lists (environments, in promotion
# order). Called by the project's own trigger workflow (project-<project>.yml, generated by scripts/scaffold_workflows.py)
# and by platform-release.yml.
#
#   detect ─► stage test:  tools (one job per tool) ─► onboarding ─► agents
#                 │ green, same commit
#             stage prod:  tools ─► onboarding ─► agents        (release tags v* only; GitHub environment approval)
#
# Each stage runs only the units with something to do (scripts/release_plan.py): a tools-only change publishes the
# tools; project.yaml re-onboards; anything else releases the agents. Manual runs, release tags and platform changes
# run everything. Pull requests: plans and validation only (plan_only), in test.
# Each unit runs in the GitHub environment of its environment and kind: model-<env> (tools, onboarding) or
# agent-<env> (agents), whose variables hold the environment's coordinates and pipeline identity.
name: _release

on:
  workflow_call:
    inputs:
      project: {type: string, required: true}
      plan_only: {type: boolean, default: false}
      all: {type: boolean, default: false}

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
      tools: ${{ steps.plan.outputs.tools }}
      project: ${{ steps.plan.outputs.project }}
      agents: ${{ steps.plan.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALL: ${{ inputs.all || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 scripts/release_plan.py ${{ inputs.project }} $([ "$ALL" = "true" ] && echo --all) --base "$BASE" | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- stage: test (main, manual runs, tags; PR plans)
  test-tools:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.environments), 'test') && needs.detect.outputs.tools != '[]'
    strategy:
      max-parallel: 1
      matrix:
        tool: ${{ fromJson(needs.detect.outputs.tools) }}
    uses: ./.github/workflows/_tool.yml
    with:
      project: ${{ inputs.project }}
      tool: ${{ matrix.tool }}
      environment: test
      plan_only: ${{ inputs.plan_only }}

  test-project:
    needs: [detect, test-tools]
    if: ${{ !cancelled() && needs.detect.result == 'success' && contains(fromJson(needs.detect.outputs.environments), 'test') && needs.detect.outputs.project == 'true' && needs.test-tools.result != 'failure' }}
    uses: ./.github/workflows/_project.yml
    with:
      project: ${{ inputs.project }}
      environment: test
      plan_only: ${{ inputs.plan_only }}

  test-agents:
    needs: [detect, test-tools, test-project]
    if: ${{ !cancelled() && needs.detect.result == 'success' && contains(fromJson(needs.detect.outputs.environments), 'test') && needs.detect.outputs.agents == 'true' && needs.test-tools.result != 'failure' && needs.test-project.result != 'failure' }}
    uses: ./.github/workflows/_agents.yml
    with:
      project: ${{ inputs.project }}
      environment: test
      plan_only: ${{ inputs.plan_only }}

  # ---------------------------------------------------------------- stage: prod (release tags v*, after test is green)
  # The same units, in prod's GitHub environments (model-prod, agent-prod: required reviewers approve the deployment).
  # Runs only when project.yaml lists prod and every test unit succeeded or had nothing to do.
  prod-tools:
    needs: [detect, test-tools, test-project, test-agents]
    if: ${{ !cancelled() && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'prod') && needs.detect.outputs.tools != '[]' && needs.test-tools.result != 'failure' && needs.test-project.result != 'failure' && needs.test-agents.result != 'failure' }}
    strategy:
      max-parallel: 1
      matrix:
        tool: ${{ fromJson(needs.detect.outputs.tools) }}
    uses: ./.github/workflows/_tool.yml
    with:
      project: ${{ inputs.project }}
      tool: ${{ matrix.tool }}
      environment: prod

  prod-project:
    needs: [detect, test-tools, test-project, test-agents, prod-tools]
    if: ${{ !cancelled() && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'prod') && needs.test-tools.result != 'failure' && needs.test-project.result != 'failure' && needs.test-agents.result != 'failure' && needs.prod-tools.result != 'failure' }}
    uses: ./.github/workflows/_project.yml
    with:
      project: ${{ inputs.project }}
      environment: prod

  prod-agents:
    needs: [detect, test-tools, test-project, test-agents, prod-tools, prod-project]
    if: ${{ !cancelled() && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'prod') && needs.test-tools.result != 'failure' && needs.test-project.result != 'failure' && needs.test-agents.result != 'failure' && needs.prod-tools.result != 'failure' && needs.prod-project.result != 'failure' }}
    uses: ./.github/workflows/_agents.yml
    with:
      project: ${{ inputs.project }}
      environment: prod
