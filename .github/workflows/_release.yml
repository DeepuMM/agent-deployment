# Release of ONE project, stage by stage through the environments its project.yaml lists (environments, in promotion
# order). Called by the project's own trigger workflow (project-<project>.yml, generated by scripts/scaffold_workflows.py)
# and by release-all.yml.
#
#   detect ─► stage dev:  tools (one job per tool) ─► onboarding ─► agents       merge to main, manual runs, tags
#                 │ green, same commit
#             stage uat:  tools ─► onboarding ─► agents                          release tags v*: approval (agent-uat, model-uat)
#                 │ green
#             stage prd:  tools ─► onboarding ─► agents                          release tags v*: approval (agent-prd, model-prd)
#
# A stage runs only if the project lists its environment and every unit of the previous stage succeeded or had
# nothing to do. Each stage runs only the units with something to do (scripts/release_plan.py): a tools-only change
# publishes the tools; project.yaml re-onboards; anything else releases the agents. Manual runs, release tags and
# shared-code changes run everything. Pull requests: plans and validation only (plan_only), in dev.
# Each unit runs in the GitHub environment of its environment and kind: model-<env> (tools, onboarding) or
# agent-<env> (agents), whose variables hold the environment's coordinates and pipeline identity, and whose
# protection rules (required reviewers on uat and prd) approve the deployment.
name: _release

on:
  workflow_call:
    inputs:
      project: {type: string, required: true}
      plan_only: {type: boolean, default: false}
      all: {type: boolean, default: false}

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
      tools: ${{ steps.plan.outputs.tools }}
      project: ${{ steps.plan.outputs.project }}
      agents: ${{ steps.plan.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALL: ${{ inputs.all || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 scripts/release_plan.py ${{ inputs.project }} $([ "$ALL" = "true" ] && echo --all) --base "$BASE" | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- stage dev (merge to main, manual runs, release tags; PR plans)
  dev-tools:
    needs: [detect]
    if: ${{ !cancelled() && needs.detect.result == 'success' && contains(fromJson(needs.detect.outputs.environments), 'dev') && needs.detect.outputs.tools != '[]' }}
    strategy:
      max-parallel: 1
      matrix:
        tool: ${{ fromJson(needs.detect.outputs.tools) }}
    uses: ./.github/workflows/_tool.yml
    with:
      project: ${{ inputs.project }}
      tool: ${{ matrix.tool }}
      environment: dev
      plan_only: ${{ inputs.plan_only }}

  dev-project:
    needs: [detect, dev-tools]
    if: ${{ !cancelled() && needs.detect.result == 'success' && contains(fromJson(needs.detect.outputs.environments), 'dev') && needs.detect.outputs.project == 'true' && needs.dev-tools.result != 'failure' }}
    uses: ./.github/workflows/_project.yml
    with:
      project: ${{ inputs.project }}
      environment: dev
      plan_only: ${{ inputs.plan_only }}

  dev-agents:
    needs: [detect, dev-tools, dev-project]
    if: ${{ !cancelled() && needs.detect.result == 'success' && contains(fromJson(needs.detect.outputs.environments), 'dev') && needs.detect.outputs.agents == 'true' && needs.dev-tools.result != 'failure' && needs.dev-project.result != 'failure' }}
    uses: ./.github/workflows/_agents.yml
    with:
      project: ${{ inputs.project }}
      environment: dev
      plan_only: ${{ inputs.plan_only }}

  # ---------------------------------------------------------------- stage uat (release tags v*, after dev; approval)
  uat-tools:
    needs: [detect, dev-tools, dev-project, dev-agents]
    if: ${{ !cancelled() && needs.detect.result == 'success' && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'uat') && needs.detect.outputs.tools != '[]' && needs.dev-tools.result != 'failure' && needs.dev-project.result != 'failure' && needs.dev-agents.result != 'failure' }}
    strategy:
      max-parallel: 1
      matrix:
        tool: ${{ fromJson(needs.detect.outputs.tools) }}
    uses: ./.github/workflows/_tool.yml
    with:
      project: ${{ inputs.project }}
      tool: ${{ matrix.tool }}
      environment: uat

  uat-project:
    needs: [detect, dev-tools, dev-project, dev-agents, uat-tools]
    if: ${{ !cancelled() && needs.detect.result == 'success' && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'uat') && needs.detect.outputs.project == 'true' && needs.dev-tools.result != 'failure' && needs.dev-project.result != 'failure' && needs.dev-agents.result != 'failure' && needs.uat-tools.result != 'failure' }}
    uses: ./.github/workflows/_project.yml
    with:
      project: ${{ inputs.project }}
      environment: uat

  uat-agents:
    needs: [detect, dev-tools, dev-project, dev-agents, uat-tools, uat-project]
    if: ${{ !cancelled() && needs.detect.result == 'success' && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'uat') && needs.detect.outputs.agents == 'true' && needs.dev-tools.result != 'failure' && needs.dev-project.result != 'failure' && needs.dev-agents.result != 'failure' && needs.uat-tools.result != 'failure' && needs.uat-project.result != 'failure' }}
    uses: ./.github/workflows/_agents.yml
    with:
      project: ${{ inputs.project }}
      environment: uat

  # ---------------------------------------------------------------- stage prd (release tags v*, after uat; approval)
  prd-tools:
    needs: [detect, dev-tools, dev-project, dev-agents, uat-tools, uat-project, uat-agents]
    if: ${{ !cancelled() && needs.detect.result == 'success' && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'prd') && needs.detect.outputs.tools != '[]' && needs.dev-tools.result != 'failure' && needs.dev-project.result != 'failure' && needs.dev-agents.result != 'failure' && needs.uat-tools.result != 'failure' && needs.uat-project.result != 'failure' && needs.uat-agents.result != 'failure' }}
    strategy:
      max-parallel: 1
      matrix:
        tool: ${{ fromJson(needs.detect.outputs.tools) }}
    uses: ./.github/workflows/_tool.yml
    with:
      project: ${{ inputs.project }}
      tool: ${{ matrix.tool }}
      environment: prd

  prd-project:
    needs: [detect, dev-tools, dev-project, dev-agents, uat-tools, uat-project, uat-agents, prd-tools]
    if: ${{ !cancelled() && needs.detect.result == 'success' && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'prd') && needs.detect.outputs.project == 'true' && needs.dev-tools.result != 'failure' && needs.dev-project.result != 'failure' && needs.dev-agents.result != 'failure' && needs.uat-tools.result != 'failure' && needs.uat-project.result != 'failure' && needs.uat-agents.result != 'failure' && needs.prd-tools.result != 'failure' }}
    uses: ./.github/workflows/_project.yml
    with:
      project: ${{ inputs.project }}
      environment: prd

  prd-agents:
    needs: [detect, dev-tools, dev-project, dev-agents, uat-tools, uat-project, uat-agents, prd-tools, prd-project]
    if: ${{ !cancelled() && needs.detect.result == 'success' && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'prd') && needs.detect.outputs.agents == 'true' && needs.dev-tools.result != 'failure' && needs.dev-project.result != 'failure' && needs.dev-agents.result != 'failure' && needs.uat-tools.result != 'failure' && needs.uat-project.result != 'failure' && needs.uat-agents.result != 'failure' && needs.prd-tools.result != 'failure' && needs.prd-project.result != 'failure' }}
    uses: ./.github/workflows/_agents.yml
    with:
      project: ${{ inputs.project }}
      environment: prd
