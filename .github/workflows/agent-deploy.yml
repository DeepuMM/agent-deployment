# Deploy projects: Foundry agent versions -> Foundry evaluation gate -> AI gateway project API (one operation per agent), policies, product
# -> Developer Portal docs -> smoke test through the gateway. Runs for each project changed on main, or on demand.
name: agent-deploy

on:
  push:
    branches: [main]
    paths: ["projects/**", "templates/**"]
  workflow_dispatch:
    inputs:
      project:
        description: Project folder name to deploy
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: list
        run: |
          all=$(ls projects | jq -R . | jq -cs .)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            projects='["${{ inputs.project }}"]'
          elif ! git rev-parse -q --verify HEAD~1 >/dev/null; then
            projects=$all                                   # first commit: deploy every project
          elif git diff --name-only HEAD~1 HEAD | grep -q '^templates/'; then
            projects=$all                                   # policy template change: redeploy every project
          else
            projects=$(git diff --name-only HEAD~1 HEAD | grep '^projects/' | cut -d/ -f2 | sort -u \
                       | while read p; do [ -d "projects/$p" ] && echo "$p"; done | jq -R . | jq -cs .)
          fi
          echo "projects=${projects:-[]}" >> "$GITHUB_OUTPUT"
          echo "Projects to deploy: ${projects:-[]}"

  deploy:
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    environment: agent-test
    strategy:
      max-parallel: 1          # one APIM / Developer Portal publish at a time
      matrix:
        project: ${{ fromJson(needs.changes.outputs.projects) }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_NAME: ${{ vars.APIM_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Validate
        run: python scripts/agent_pipeline.py validate ${{ matrix.project }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy agents to Foundry
        run: python scripts/agent_pipeline.py deploy ${{ matrix.project }}
      - name: Foundry evaluation gate (new agent versions)
        run: python scripts/agent_pipeline.py evaluate ${{ matrix.project }}
      - name: Register project API in AI gateway and publish developer docs
        run: python scripts/agent_pipeline.py register ${{ matrix.project }}
      - name: Smoke test every agent through the gateway
        run: python scripts/agent_pipeline.py smoke ${{ matrix.project }}
