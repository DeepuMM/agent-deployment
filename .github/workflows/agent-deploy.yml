# Model access first (gateway/README.md): for projects whose project.yaml changed, the reusable model-access
# workflow creates or updates the AI Gateway connection and limits before their agents are deployed.
# Deploy projects: Foundry agent versions -> Foundry evaluation gate -> AI gateway project API (one operation per agent), policies, product
# -> Developer Portal docs -> smoke test through the gateway. Runs for each project changed on main, or on demand.
# Each project runs in the GitHub environment of its platform environment (project.yaml `environment`, default
# test -> agent-test), whose variables point at that environment's Foundry, APIM and pipeline identity.
name: agent-deploy

on:
  push:
    branches: [main]
    paths: ["projects/**", "templates/**"]
  workflow_dispatch:
    inputs:
      project:
        description: Project folder name to deploy
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
      matrix: ${{ steps.list.outputs.matrix }}
      model_projects: ${{ steps.list.outputs.model_projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: list
        run: |
          all=$(ls projects | jq -R . | jq -cs .)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            projects='["${{ inputs.project }}"]'
          elif ! git rev-parse -q --verify HEAD~1 >/dev/null; then
            projects=$all                                   # first commit: deploy every project
          elif git diff --name-only HEAD~1 HEAD | grep -q '^templates/'; then
            projects=$all                                   # policy template change: redeploy every project
          else
            projects=$(git diff --name-only HEAD~1 HEAD | grep '^projects/' | cut -d/ -f2 | sort -u \
                       | while read p; do [ -d "projects/$p" ] && echo "$p"; done | jq -R . | jq -cs .)
          fi
          echo "projects=${projects:-[]}" >> "$GITHUB_OUTPUT"
          echo "Projects to deploy: ${projects:-[]}"
          echo "matrix=$(python3 scripts/matrix.py projects agent $(echo "${projects:-[]}" | jq -r '.[]'))" >> "$GITHUB_OUTPUT"
          # Of those, the ones whose project.yaml changed and that use platform models: model access runs first.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse -q --verify HEAD~1 >/dev/null; then
            changed_yaml=$(echo "${projects:-[]}" | jq -r '.[]')
          else
            changed_yaml=$(git diff --name-only HEAD~1 HEAD | grep '^projects/.*/project.yaml$' | cut -d/ -f2 | sort -u)
          fi
          model_projects=$(for p in $changed_yaml; do [ -f "projects/$p/project.yaml" ] && grep -q '^models:' "projects/$p/project.yaml" && echo "$p"; done | jq -R . | jq -cs .)
          echo "model_projects=${model_projects:-[]}" >> "$GITHUB_OUTPUT"
          echo "Model access first for: ${model_projects:-[]}"

  model-access:
    needs: changes
    if: needs.changes.outputs.model_projects != '[]'
    uses: ./.github/workflows/model-access.yml
    with:
      projects: ${{ needs.changes.outputs.model_projects }}
    secrets: inherit

  deploy:
    needs: [changes, model-access]
    # Runs when model access succeeded or wasn't needed (skipped); never after a failed model access.
    if: ${{ !cancelled() && needs.changes.outputs.projects != '[]' && needs.model-access.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.github_environment }}
    strategy:
      max-parallel: 1          # one APIM / Developer Portal publish at a time
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_NAME: ${{ vars.APIM_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Validate
        run: python scripts/agent_pipeline.py validate ${{ matrix.project }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy agents to Foundry
        run: python scripts/agent_pipeline.py deploy ${{ matrix.project }}
      - name: Foundry evaluation gate (new agent versions)
        run: python scripts/agent_pipeline.py evaluate ${{ matrix.project }}
      - name: Register project API in AI gateway and publish developer docs
        run: python scripts/agent_pipeline.py register ${{ matrix.project }}
      - name: Smoke test every agent through the gateway
        run: python scripts/agent_pipeline.py smoke ${{ matrix.project }}
