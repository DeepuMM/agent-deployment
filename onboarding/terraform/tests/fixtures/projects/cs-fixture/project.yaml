# Test fixture (tests/plan.tftest.hcl): a project with its own content safety settings, whose agents run in a Foundry
# project with a different name (shared-foundry) than the repo project (cs-fixture).
name: cs-fixture
environment: sandbox
display_name: Content safety fixture
owner: ai-platform-team
foundry:
  project: shared-foundry
gateway:
  path: ai/cs-fixture
  product: agents-sandbox
  rate_limit_per_minute: 60
  quota_per_day: 1000
models:
  connection: platform-models
  content_safety:            # project level: every model
    self_harm: 3
  allowed:
    - name: gpt-5.4-mini     # project level only
      tokens_per_minute: 1000
      tokens_per_day: 10000
    - name: gpt-x            # model level on top of the project level
      tokens_per_minute: 1000
      tokens_per_day: 10000
      content_safety:
        violence: 2
        hate: 1
