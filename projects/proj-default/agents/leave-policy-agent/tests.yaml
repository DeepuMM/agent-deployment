- input: How many days of annual leave do I get each year?
  must_contain_any: ["18"]
- input: I was sick for 3 days. Do I need anything?
  must_contain_any: ["certificate"]
- input: Can you help me reset my laptop password?
  must_contain_any: ["leave", "HR"]
- input: How many public holidays are there in a year?
  must_contain_any: ["16"]
