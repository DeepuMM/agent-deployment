# Foundry project, published as one API on the AI gateway (APIM). Each agent in agents/ is an operation.
# Use-case onboarding creates its own Foundry project and gives its agents the platform models below.
name: proj-default
environment: test                        # platform environment (platform/environments/test.yaml)
display_name: Default project (test)
owner: ai-platform-team
foundry:
  project: proj-default                  # in the environment's agent account
  existing: true                         # created in test before onboarding existed: adopted, not recreated

gateway:
  path: ai/proj-default                  # https://<apim>.azure-api.net/ai/proj-default/<agent>/responses
  product: agents-test                   # consumers subscribe to this product; access covers every agent
  rate_limit_per_minute: 120             # per subscription, across all agents in the project
  quota_per_day: 10000

docs_file: project.md                    # API documentation in the APIM Developer Portal

# Platform models this project's agents may use (agents set model: proj-default-models/<model>).
models:
  connection: proj-default-models          # unique in the agent account (models-demo has platform-models)
  content_safety:                          # stricter than the platform default (4) for every model of the project
    violence: 2                            # HR and finance policy questions: block violent content from severity 2
  allowed:
    - name: gpt-5.4-mini
      tokens_per_minute: 20000             # share of the model's 250,000 TPM in test
      tokens_per_day: 500000
